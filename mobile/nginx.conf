# Mobile app (web build): same API proxy as the web console.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # uploads above 10 MB are refused here, before they reach the backend
  client_max_body_size 10m;
  error_page 413 = @too_large;
  location @too_large {
    default_type application/json;
    return 413 '{"status":413,"code":"FILE_TOO_LARGE","message":"The file is larger than 10 MB"}';
  }

  # video KYC recordings can be up to 60 MB
  location /api/vkyc/ {
    client_max_body_size 60m;
    proxy_pass http://backend:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }

  # a field visit syncs its photos in one request
  location /api/field/ {
    client_max_body_size 100m;
    proxy_pass http://backend:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }

  # API and health go to the Spring Boot backend
  location /api/ {
    proxy_pass http://backend:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;  # scanned bank statements can take a few minutes to read
  }
  location /actuator/ {
    proxy_pass http://backend:8081;
  }

  # built files have a content hash in their name and never change: cache them for a year
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy same-origin;
  }

  # single-page app: unknown paths serve index.html, which must never be cached so users get new versions at once
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy same-origin;
  }

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy same-origin;
}
