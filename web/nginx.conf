server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # uploads above 10 MB are refused here, before they reach the backend
  client_max_body_size 10m;
  error_page 413 = @too_large;
  location @too_large {
    default_type application/json;
    return 413 '{"status":413,"code":"FILE_TOO_LARGE","message":"The file is larger than 10 MB"}';
  }

  # API and health go to the Spring Boot backend
  location /api/ {
    proxy_pass http://backend:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }
  location /actuator/ {
    proxy_pass http://backend:8081;
  }

  # single-page app: unknown paths serve index.html
  location / {
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy same-origin;
}
