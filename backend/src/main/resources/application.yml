spring:
  application:
    name: rhythm-los
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rhythm}
    username: ${DB_USER:rhythm}
    password: ${DB_PASSWORD:rhythm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      # documents are limited to 10 MB in DocumentService; video KYC recordings may be larger
      max-file-size: 60MB
      max-request-size: 61MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8081}
  tomcat:
    # read the rest of an oversized upload so the client gets a clean 413 instead of a reset connection
    max-swallow-size: 70MB
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi

rhythm:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-only-secret-change-me-dev-only-secret-0123456789}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  storage:
    path: ${STORAGE_PATH:./data/documents}
  integration:
    max-attempts: ${INTEGRATION_MAX_ATTEMPTS:3}
    backoff-ms: ${INTEGRATION_BACKOFF_MS:300}
  kfs:
    otp: ${KFS_MOCK_OTP:123456}
  demo-data: ${DEMO_DATA:true}
  workflow:
    # how often stage SLAs are checked; a breached stage gets its on-failure action (queue, escalate, reject, pause)
    sla-check-ms: ${WORKFLOW_SLA_CHECK_MS:60000}
    sla-initial-delay-ms: ${WORKFLOW_SLA_INITIAL_DELAY_MS:60000}
  document-ai:
    # URL of the AI document service. Empty = filename-based mock reader and mock KYC (used by unit tests).
    url: ${DOCUMENT_AI_URL:}
    timeout-seconds: ${DOCUMENT_AI_TIMEOUT:180}
  vkyc:
    link-hours: ${VKYC_LINK_HOURS:24}
    # WebRTC ICE servers as JSON, e.g. [{"urls":"turn:turn.example.in:3478","username":"u","credential":"p"}].
    # Empty works on the same machine or LAN; production needs a TURN server hosted in India.
    ice-servers: ${VKYC_ICE_SERVERS:[]}
