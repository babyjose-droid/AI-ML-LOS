# Rhythm LOS - local stack: PostgreSQL + Spring Boot API + AI document service + React web
# Start:  docker compose up --build
# Open:   http://localhost:3000
# Ports busy?  BACKEND_PORT=8091 WEB_PORT=3001 docker compose up --build   (users: sales1, ops1, co1, cm1, cro1, fraud1, comp1, admin / Rhythm@123)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rhythm
      POSTGRES_USER: rhythm
      POSTGRES_PASSWORD: rhythm
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhythm -d rhythm"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    # AI document service: OCR (Tesseract) on this machine; Claude vision fallback only if ANTHROPIC_API_KEY is set
    build: ./ai
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5}
      ALLOW_SPECIMEN: ${ALLOW_SPECIMEN:-true}
      REVIEW_CONFIDENCE: ${REVIEW_CONFIDENCE:-0.80}

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/rhythm
      DB_USER: rhythm
      DB_PASSWORD: rhythm
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-local-dev-secret-change-me-0123}
      DEMO_DATA: ${DEMO_DATA:-true}
      INTEGRATION_BACKOFF_MS: ${INTEGRATION_BACKOFF_MS:-300}
      DOCUMENT_AI_URL: http://ai:8090
    volumes:
      - documents:/data/documents
    ports:
      # API port on your machine (only needed for /api/docs); change with BACKEND_PORT if 8081 is taken
      - "127.0.0.1:${BACKEND_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy

  web:
    build: ./web
    ports:
      # web app port on your machine; change with WEB_PORT if 3000 is taken
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
  documents:
