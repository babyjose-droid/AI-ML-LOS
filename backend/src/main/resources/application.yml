spring:
  application:
    name: rhythm-los
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rhythm}
    username: ${DB_USER:rhythm}
    password: ${DB_PASSWORD:rhythm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8081}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi

rhythm:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-only-secret-change-me-dev-only-secret-0123456789}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  storage:
    path: ${STORAGE_PATH:./data/documents}
  integration:
    max-attempts: ${INTEGRATION_MAX_ATTEMPTS:3}
    backoff-ms: ${INTEGRATION_BACKOFF_MS:300}
  kfs:
    otp: ${KFS_MOCK_OTP:123456}
  demo-data: ${DEMO_DATA:true}
